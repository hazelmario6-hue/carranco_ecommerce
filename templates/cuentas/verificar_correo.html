<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Verificar correo · Carranco</title><style>body{background:#fbf7ef;color:#182c38;font:17px system-ui;margin:0;padding:28px}main{max-width:520px;margin:40px auto;background:white;padding:28px;border-radius:20px}h1{font-family:Georgia,serif}button,a{display:inline-block;padding:14px;border-radius:10px}button{background:#182c38;color:white;border:0;font-size:16px}</style></head><body><main><h1>Carranco</h1>{% if enlace_valido %}<h2>Confirma tu correo</h2><p>Confirma solo si tú solicitaste verificar esta cuenta.</p><form method="post">{% csrf_token %}<button type="submit">Confirmar mi correo</button></form>{% else %}<h2>El enlace ya no es válido</h2><p>Puede haber vencido, haberse utilizado o haber sido sustituido por uno nuevo.</p><a href="{% url 'cuentas:reenviar_correo' %}">Solicitar otro enlace</a>{% endif %}</main></body></html>
