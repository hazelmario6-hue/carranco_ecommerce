{% load storefront %}
<article class="product-card{% if nav_active != 'inicio' %} catalog-card{% endif %}" data-product-card data-category="{{ producto.categoria.slug }}" data-search="{{ producto.nombre }} {{ producto.categoria.nombre }} {{ producto.descripcion }}"{% if coincidencias is not None and producto.pk not in coincidencias %} hidden{% endif %}>
<a class="product-image" href="{{ producto.get_absolute_url }}" aria-label="Ver {{ producto.nombre }}"><img src="{{ producto.foto }}" width="600" height="600" loading="lazy" alt="Envase de {{ producto.nombre }} Carranco; fotografía del fabricante"><span class="product-tag">{{ producto.etiqueta|storefront_text }}</span></a>
<div class="product-content"><h3>{{ producto.nombre }}</h3><p class="product-category">{{ producto.categoria.nombre }}</p><p class="product-presentation">Carranco · {{ producto.presentacion }}</p><div class="product-bottom"><strong class="product-price">${{ producto.precio_catalogo|floatformat:2 }} <small>MXN</small></strong></div><p class="product-stock">{{ producto.disponibilidad }}</p><div class="product-actions"><a class="button button-outline" href="{{ producto.get_absolute_url }}">Ver producto</a><form method="post" action="{% url 'carrito:actualizar' %}" class="cart-add-form">{% csrf_token %}<input type="hidden" name="producto" value="{{ producto.pk }}"><input type="hidden" name="cantidad" value="1"><input type="hidden" name="operacion" value="add"><button class="{% if nav_active == 'inicio' %}product-add{% else %}button button-navy catalog-add{% endif %}" type="submit" aria-label="Agregar {{ producto.nombre }} al carrito"{% if not producto.stock_disponible %} disabled{% endif %}>{% if nav_active == 'inicio' %}<i class="fa-solid fa-plus" aria-hidden="true"></i>{% else %}Agregar al carrito{% endif %}</button></form></div></div></article>
